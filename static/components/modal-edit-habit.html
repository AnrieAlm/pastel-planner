<button class="modal-close" data-close-modal aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.5" stroke-linecap="square"/></svg></button>
<h3 id="habit-sheet-title">Edit habit</h3>

<form method="post" id="habit-form" action="/save-habit">
  <input type="hidden" name="next" value="/habits" />
  <input type="hidden" name="habit_id" id="habit-id" />
  <input type="hidden" name="days" id="habit-days-value" />

  <div id="habit-suggestions" hidden>
    <label id="habit-ideas-label">Need an idea?</label>
    <div class="suggestion-chips" role="group" aria-labelledby="habit-ideas-label">
      <button type="button" class="suggestion-chip habit-suggestion">Morning yoga</button>
      <button type="button" class="suggestion-chip habit-suggestion">Read</button>
      <button type="button" class="suggestion-chip habit-suggestion">Journal</button>
      <button type="button" class="suggestion-chip habit-suggestion">Drink water</button>
      <button type="button" class="suggestion-chip habit-suggestion">Stretch</button>
      <button type="button" class="suggestion-chip habit-suggestion">Evening walk</button>
    </div>
  </div>

  <label for="habit-name">Name</label>
  <input type="text" id="habit-name" name="name" maxlength="40" placeholder="Or type your own" required />

  <label for="habit-time">Time (optional)</label>
  <input type="time" id="habit-time" name="time" />

  <label id="habit-days-label">Days</label>
  <div class="day-picker" role="group" aria-labelledby="habit-days-label">
    <button type="button" data-day="mon" class="active" aria-pressed="true">Mon</button>
    <button type="button" data-day="tue" class="active" aria-pressed="true">Tue</button>
    <button type="button" data-day="wed" class="active" aria-pressed="true">Wed</button>
    <button type="button" data-day="thu" class="active" aria-pressed="true">Thu</button>
    <button type="button" data-day="fri" class="active" aria-pressed="true">Fri</button>
    <button type="button" data-day="sat" class="active" aria-pressed="true">Sat</button>
    <button type="button" data-day="sun" class="active" aria-pressed="true">Sun</button>
  </div>

  <label style="display:flex; align-items:center; gap:var(--sp-xs);">
    <input type="checkbox" id="habit-active" name="active" checked /> Active (switch off to pause it)
  </label>

  <div class="modal-actions">
    <button type="submit" class="btn-modal-primary">Save</button>
    <button type="submit" class="btn-modal-danger" id="habit-remove" formnovalidate hidden>Remove</button>
  </div>
</form>
