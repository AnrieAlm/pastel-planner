<button class="modal-close" data-close-modal aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.5" stroke-linecap="square"/></svg></button>
<h3>New note</h3>

<form method="post" id="new-note-form" action="/add-note">
  <input type="hidden" name="next" value="/notes" />
  <input type="hidden" name="color" value="1" />

  <label for="new-note-title">Title</label>
  <input type="text" id="new-note-title" name="title" maxlength="200" placeholder="e.g. Pick up herbs" required />

  <label for="new-note-content">Notes</label>
  <textarea id="new-note-content" name="content" maxlength="2000" placeholder="Optional details…"></textarea>

  <label id="new-note-colour-label">Colour</label>
  <div class="colour-options" role="group" aria-labelledby="new-note-colour-label">
    <button type="button" class="colour-dot colour-1 selected" aria-label="Honey cream" aria-pressed="true"></button>
    <button type="button" class="colour-dot colour-2" aria-label="Dried rose" aria-pressed="false"></button>
    <button type="button" class="colour-dot colour-3" aria-label="Faded sage" aria-pressed="false"></button>
    <button type="button" class="colour-dot colour-4" aria-label="Lilac" aria-pressed="false"></button>
    <button type="button" class="colour-dot colour-5" aria-label="Powder blue" aria-pressed="false"></button>
  </div>

  <label style="display:flex; align-items:center; gap:var(--sp-xs);">
    <input type="checkbox" id="new-note-urgent" name="urgent" /> Urgent
  </label>

  <label for="new-note-deadline">Deadline (optional)</label>
  <input type="date" id="new-note-deadline" name="deadline" />

  <label for="new-note-remind">Remind me (optional)</label>
  <input type="datetime-local" id="new-note-remind" name="remind" />

  <label for="new-note-deadline">Deadline (optional)</label>
  <input type="date" id="new-note-deadline" name="deadline" />
  
  <div class="finish-by-block" hidden>
    <label>When do you want to have it done?</label>
    <div class="suggestion-chips" role="group" aria-label="Quick choices for the finish-by date">
      <button type="button" class="suggestion-chip finish-chip" data-days="1">1 day before</button>
      <button type="button" class="suggestion-chip finish-chip" data-days="3">3 days before</button>
      <button type="button" class="suggestion-chip finish-chip" data-days="7">1 week before</button>
      <button type="button" class="suggestion-chip finish-chip" data-days="custom">Custom</button>
    </div>
    <label for="new-note-finish-by">Aim to finish by</label>
    <input type="date" id="new-note-finish-by" name="finish_by" />
  </div>

  <div class="modal-actions">
    <button type="submit" class="btn-modal-primary">Add note</button>
  </div>
</form>
