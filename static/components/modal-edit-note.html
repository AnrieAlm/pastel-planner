<button class="modal-close" data-close-modal aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.5" stroke-linecap="square"/></svg></button>
<h3>Edit note</h3>

<form method="post" id="edit-note-form" action="/update-note/">
  <input type="hidden" name="next" value="/notes" />
  <input type="hidden" name="color" value="1" />
  <input type="hidden" name="has_bucket" value="1" />

  <label for="note-title">Title</label>
  <input type="text" id="note-title" name="title" maxlength="200" required />

  <label for="note-content">Notes</label>
  <textarea id="note-content" name="content" maxlength="2000"></textarea>

  <label id="note-colour-label">Colour</label>
  <div class="colour-options" role="group" aria-labelledby="note-colour-label">
    <button type="button" class="colour-dot colour-1 selected" aria-label="Honey cream" aria-pressed="true"></button>
    <button type="button" class="colour-dot colour-2" aria-label="Dried rose" aria-pressed="false"></button>
    <button type="button" class="colour-dot colour-3" aria-label="Faded sage" aria-pressed="false"></button>
    <button type="button" class="colour-dot colour-4" aria-label="Lilac" aria-pressed="false"></button>
    <button type="button" class="colour-dot colour-5" aria-label="Powder blue" aria-pressed="false"></button>
  </div>

  <label style="display:flex; align-items:center; gap:var(--sp-xs);">
    <input type="checkbox" id="note-urgent" name="urgent" /> Urgent
  </label>

  <label for="note-date">Date</label>
  <input type="date" id="note-date" name="date" />

  <label for="note-time">Time (optional)</label>
  <input type="time" id="note-time" name="time" />

  <label for="note-deadline">Deadline</label>
  <input type="date" id="note-deadline" name="deadline" />

  <div class="finish-by-block" hidden>
    <label>When do you want to have it done?</label>
    <div class="suggestion-chips" role="group" aria-label="Quick choices for the finish-by date">
      <button type="button" class="suggestion-chip finish-chip" data-days="1">1 day before</button>
      <button type="button" class="suggestion-chip finish-chip" data-days="3">3 days before</button>
      <button type="button" class="suggestion-chip finish-chip" data-days="7">1 week before</button>
      <button type="button" class="suggestion-chip finish-chip" data-days="custom">Custom</button>
    </div>
    <label for="note-finish-by">Aim to finish by</label>
    <input type="date" id="note-finish-by" name="finish_by" />
  </div>

  <label for="note-bucket">Bucket list</label>
  <select id="note-bucket" name="bucket">
    <option value="">Not on the bucket list</option>
    <option value="movies">🎬 Movies</option>
    <option value="places">📍 Places</option>
    <option value="things">📦 Things</option>
    <option value="experiences">✨ Experiences</option>
  </select>

  <div class="modal-actions" id="note-calendar-actions">
    <a class="btn-modal-secondary" id="note-gcal" href="#" target="_blank" rel="noopener noreferrer">Add to Google Calendar</a>
    <a class="btn-modal-secondary" id="note-ics" href="#">Download .ics</a>
  </div>
  <p class="modal-hint hidden" id="note-calendar-hint">Add a date or a deadline (and save) to put this in your calendar.</p>

  <div class="modal-actions">
    <button type="submit" class="btn-modal-primary">Save</button>
    <button type="submit" class="btn-modal-secondary" id="note-done-btn" formnovalidate>Mark done</button>
    <button type="submit" class="btn-modal-danger" id="note-delete-btn" formnovalidate>Delete</button>
  </div>
</form>
