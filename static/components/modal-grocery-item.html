<button class="modal-close" data-close-modal aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.5" stroke-linecap="square"/></svg></button>
<h3>Add to grocery list</h3>

<form method="post" action="/add-grocery" id="grocery-form">
  <input type="hidden" name="next" value="/grocery" />

  <label for="grocery-item-name">Item</label>
  <input type="text" id="grocery-item-name" name="name" maxlength="400" placeholder="e.g. Almond butter (or several: milk, eggs, bread)" required />

  <div class="modal-actions">
    <button type="submit" class="btn-modal-primary">Add</button>
  </div>
</form>
