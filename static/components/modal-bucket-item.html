<button class="modal-close" data-close-modal aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.5" stroke-linecap="square"/></svg></button>
<h3>Add to bucket list</h3>

<label for="bucket-title">Title</label>
<input type="text" id="bucket-title" placeholder="e.g. Visit Kyoto" />

<label for="bucket-category">Category</label>
<select id="bucket-category">
  <option value="movies">🎬 Movies</option>
  <option value="places">📍 Places</option>
  <option value="things">📦 Things</option>
  <option value="experiences">✨ Experiences</option>
</select>

<label for="bucket-link">Link (optional)</label>
<input type="url" id="bucket-link" placeholder="https://…" />

<div class="modal-actions">
  <button class="btn-modal-primary">Add item</button>
</div>
