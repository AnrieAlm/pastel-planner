# Runs reminders.py on a schedule. Render's free web service cannot run background jobs on its
# own, so GitHub Actions does it instead — about every 15 minutes, all day, every day.
name: Send reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:       # lets you also run it by hand from the Actions tab, to test it

# Never let two runs overlap (a slow run plus the next scheduled one could send a reminder twice)
concurrency:
  group: send-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reminders.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python reminders.py
