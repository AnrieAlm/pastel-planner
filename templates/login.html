{% extends "base.html" %}
{% block title %}Sign in{% endblock %}

{# The login page has no sidebar or bottom nav, so it replaces the whole body block #}
{% block body %}
<div id="auth-screen" class="screen active">
  <div id="auth-container" data-reason="{{ reason }}">
    <div class="auth-card">
            <img class="auth-logo" src="/icons/icon-192.png" alt="" width="88" height="88" />
      <h1>Calyx Planner</h1>
      <p class="tagline">your cosy corner for everything</p>

      <p class="auth-error" role="alert" aria-live="assertive"></p>

      <form id="auth-form" novalidate>
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="you@example.com" autocomplete="email" />

        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" />

        <button type="submit" class="btn-primary" id="auth-submit">Sign in</button>
      </form>

      <p class="auth-toggle">
        or <a href="#" id="auth-toggle-link">Create account</a>
      </p>

      <p class="auth-privacy">Your notes are yours alone.</p>
    </div>
  </div>
</div>
{% endblock %}
